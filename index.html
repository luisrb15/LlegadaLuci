<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llegada de Luci</title>
    <link rel="icon" href="static/img/favicon.jpg" type="image/jpeg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #scene {
            position: fixed;
            inset: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 20%, #0d0d1a 0%, #000 70%);
            overflow: hidden;
        }

        /* ─── Estrellas ─── */
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%,100% { opacity: 0.15; }
            50%      { opacity: 0.9;  }
        }

        /* ─── AVIÓN (tercio superior) ─── */
        #plane {
            position: absolute;
            top: 12vh;
            left: -230px;
            width: 210px;
            height: auto;
            z-index: 6;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7));
            will-change: left;
        }
        .plane-fly { animation: fly-across 6s linear forwards; }
        @keyframes fly-across {
            from { left: -230px; }
            to   { left: calc(100vw + 230px); }
        }

        /* ─── ESTELA ───
           SVG viewBox=240x100 → a 210px de ancho, alto ≈ 87px.
           Fuselaje centrado en y=52 → 52%*87 ≈ 45px desde el top.
           La estela se mueve CON el avión (mismo timing) pegada a su cola. */
        #trail {
            position: absolute;
            top: calc(12vh + 45px);
            left: -520px;
            width: 290px;
            height: 4px;
            background: linear-gradient(90deg,
                rgba(255,255,255,0)   0%,
                rgba(255,255,255,0.7) 55%,
                rgba(255,255,255,0.4) 100%);
            border-radius: 3px;
            filter: blur(1.5px);
            z-index: 5;
            will-change: left;
        }
        .trail-fly { animation: trail-across 6s linear forwards; }
        @keyframes trail-across {
            0%   { left: -520px; opacity: 0; }
            4%   { opacity: 0.95; }
            85%  { opacity: 0.8; }
            100% { left: calc(100vw - 60px); opacity: 0.3; }
        }

        /* ─── IMAGEN QUE CAE ───
           SOLO usa transform + opacity → GPU compositor → fluida en todos los dispositivos.
           NO anima top/width/height/margin (evita reflow = imagen que se detiene). */
        #drop {
            position: absolute;
            left: 50%;
            top: 12vh;
            width:  clamp(220px, 58vmin, 390px);
            height: clamp(220px, 58vmin, 390px);
            transform: translateX(-50%) translateY(0vh) scale(0.07) rotate(0deg);
            transform-origin: center center;
            z-index: 8;
            opacity: 0;
            will-change: transform, opacity;
        }
        #drop img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .drop-fall {
            animation: fall-spin 3.3s cubic-bezier(0.38, 0.01, 0.62, 1) forwards;
        }
        @keyframes fall-spin {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(0vh)   scale(0.07) rotate(0deg);
            }
            6% {
                opacity: 1;
                transform: translateX(-50%) translateY(1.5vh) scale(0.13) rotate(60deg);
            }
            30% {
                transform: translateX(-50%) translateY(10vh)  scale(0.40) rotate(660deg);
            }
            62% {
                transform: translateX(-50%) translateY(24vh)  scale(0.80) rotate(1360deg);
            }
            88% {
                transform: translateX(-50%) translateY(32vh)  scale(1.06) rotate(1764deg);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(30vh)  scale(1)    rotate(1800deg);
            }
        }

        /* ─── CONTADOR ─── */
        #countdown {
            position: absolute;
            bottom: 6vh;
            left: 50%;
            transform: translateX(-50%) translateY(28px);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.9s ease, transform 0.9s ease;
        }
        #countdown.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .cd-box {
            background: rgba(12, 12, 38, 0.90);
            border: 1.5px solid rgba(255,255,255,0.38);
            border-radius: 14px;
            padding: clamp(8px,2vw,14px) clamp(10px,2.5vw,18px);
            min-width: clamp(58px,14vw,82px);
            text-align: center;
            box-shadow: 0 6px 24px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.12);
        }
        .cd-num {
            display: block;
            font-size: clamp(1.5rem, 5vw, 2.8rem);
            font-weight: 800;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 12px rgba(255,255,255,0.35);
            font-variant-numeric: tabular-nums;
        }
        .cd-label {
            display: block;
            margin-top: 5px;
            font-size: clamp(0.6rem, 1.8vw, 0.75rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #d0d0e8;
            font-weight: 600;
        }
        #cd-done {
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 800;
            color: #ffd200;
            text-align: center;
        }

        /* ─── CONFETI ─── */
        .confetti {
            position: absolute;
            width: 9px; height: 15px;
            z-index: 12;
            opacity: 0;
            will-change: transform, opacity;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            #plane { width: 125px; }
            #trail {
                top: calc(12vh + 27px);
                left: -330px; width: 175px;
            }
            #countdown {
                bottom: 10vh;
                gap: 7px;
            }
            .cd-box {
                min-width: 62px;
                padding: 10px 10px;
            }
        }
        @media (min-width: 481px) and (max-width: 768px) {
            #plane { width: 160px; }
            #trail {
                top: calc(12vh + 35px);
                left: -410px; width: 220px;
            }
            #countdown {
                bottom: 8vh;
            }
        }
    </style>
</head>
<body>
<div id="scene">

    <div id="trail"></div>

    <svg id="plane" viewBox="0 0 240 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 55 Q30 42 90 42 L170 42 Q210 42 232 52 Q212 62 170 62 L90 62 Q30 62 10 55 Z"
              fill="#f3f4f8" stroke="#c9ccd6" stroke-width="1.5"/>
        <circle cx="70"  cy="52" r="3.2" fill="#7fd3ff"/>
        <circle cx="88"  cy="52" r="3.2" fill="#7fd3ff"/>
        <circle cx="106" cy="52" r="3.2" fill="#7fd3ff"/>
        <circle cx="124" cy="52" r="3.2" fill="#7fd3ff"/>
        <circle cx="142" cy="52" r="3.2" fill="#7fd3ff"/>
        <path d="M232 52 Q212 62 170 62 L200 52 Z" fill="#e2004b"/>
        <path d="M120 45 L150 12 L172 14 L150 45 Z" fill="#d7dae4"/>
        <path d="M118 60 L138 92 L160 90 L150 60 Z" fill="#c2c6d2"/>
        <path d="M14 55 L2 26 L20 30 L34 50 Z" fill="#e2004b"/>
    </svg>

    <div id="drop">
        <img src="static/img/foto.jpg" alt="Luci">
    </div>

    <div id="countdown">
        <div class="cd-box">
            <span class="cd-num"  id="cd-days">0</span>
            <span class="cd-label">Días</span>
        </div>
        <div class="cd-box">
            <span class="cd-num"  id="cd-hours">0</span>
            <span class="cd-label">Horas</span>
        </div>
        <div class="cd-box">
            <span class="cd-num"  id="cd-mins">0</span>
            <span class="cd-label">Min</span>
        </div>
        <div class="cd-box">
            <span class="cd-num"  id="cd-secs">0</span>
            <span class="cd-label">Seg</span>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const scene  = document.getElementById('scene');
    const plane  = document.getElementById('plane');
    const trail  = document.getElementById('trail');
    const drop   = document.getElementById('drop');
    const cdWrap = document.getElementById('countdown');

    // 17/10/2026 09:25:00 hora estándar Argentina (GMT-3, sin DST)
    const targetDate = new Date('2026-10-17T09:25:00-03:00');

    /* Estrellas */
    for (let i = 0; i < 85; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left            = Math.random() * 100 + 'vw';
        s.style.top             = Math.random() * 100 + 'vh';
        s.style.animationDelay  = (Math.random() * 3).toFixed(2) + 's';
        s.style.transform       = `scale(${(0.6 + Math.random() * 1.5).toFixed(2)})`;
        scene.appendChild(s);
    }

    /* Arranque: avión + estela */
    plane.classList.add('plane-fly');
    trail.classList.add('trail-fly');

    /* El avión cruza el centro a los ~3 s → suelta la imagen */
    setTimeout(() => drop.classList.add('drop-fall'), 3000);

    /* Aterrizaje a los 3 + 3.3 = 6.3 s */
    setTimeout(() => {
        // Fijar posición final sin "snap"
        drop.classList.remove('drop-fall');
        drop.style.opacity   = '1';
        drop.style.transform = 'translateX(-50%) translateY(30vh) scale(1) rotate(1800deg)';

        // Rebote
        drop.animate([
            { transform: 'translateX(-50%) translateY(30vh)   scale(1,1)      rotate(1800deg)' },
            { transform: 'translateX(-50%) translateY(31.2vh) scale(1.07,0.93) rotate(1800deg)' },
            { transform: 'translateX(-50%) translateY(29.5vh) scale(0.97,1.04) rotate(1800deg)' },
            { transform: 'translateX(-50%) translateY(30vh)   scale(1,1)      rotate(1800deg)' }
        ], { duration: 650, easing: 'ease-out', fill: 'forwards' });

        launchConfetti();
        cdWrap.classList.add('show');
        setTimeout(launchConfetti, 550);
        setTimeout(launchConfetti, 1300);
    }, 6300);

    /* Confeti */
    const COLORS = ['#ff5eae','#ffd200','#4de1ff','#7CFC00','#ff7043','#b388ff','#fff','#00e5ff'];
    function launchConfetti() {
        for (let i = 0; i < 75; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            const fromLeft = i % 2 === 0;
            c.style.background  = COLORS[i % COLORS.length];
            if (Math.random() > 0.45) c.style.borderRadius = '50%';
            c.style.top  = (22 + Math.random() * 62) + 'vh';
            c.style.left = fromLeft ? '-14px' : 'calc(100vw + 14px)';
            const dx  = (28 + Math.random() * 42) * (fromLeft ? 1 : -1);
            const ry  = -(7 + Math.random() * 20);
            const fy  = 32 + Math.random() * 42;
            const rot = (Math.random() * 720 + 360) * (Math.random() > 0.5 ? 1 : -1);
            const dur = 1900 + Math.random() * 1400;
            scene.appendChild(c);
            c.animate([
                { transform: `translate(0,0) rotate(0deg)`,                             opacity: 1 },
                { transform: `translate(${dx*0.55}vw,${ry}vh) rotate(${rot*0.38}deg)`, opacity: 1, offset: 0.32 },
                { transform: `translate(${dx}vw,${fy}vh) rotate(${rot}deg)`,            opacity: 0 }
            ], { duration: dur, easing: 'cubic-bezier(0.22,0.6,0.28,1)', fill: 'forwards' })
            .onfinish = () => c.remove();
        }
    }

    /* Contador */
    const elD = document.getElementById('cd-days');
    const elH = document.getElementById('cd-hours');
    const elM = document.getElementById('cd-mins');
    const elS = document.getElementById('cd-secs');
    const pad = n => String(n).padStart(2, '0');

    function tick() {
        const diff = targetDate.getTime() - Date.now();
        if (diff <= 0) {
            clearInterval(timer);
            cdWrap.innerHTML = '<div id="cd-done">🎉 ¡Ya llegó el gran día! 🎉</div>';
            return;
        }
        elD.textContent = Math.floor(diff / 86400000);
        elH.textContent = pad(Math.floor((diff % 86400000) / 3600000));
        elM.textContent = pad(Math.floor((diff % 3600000)  / 60000));
        elS.textContent = pad(Math.floor((diff % 60000)    / 1000));
    }
    tick();
    const timer = setInterval(tick, 1000);
});
</script>
</body>
</html>
